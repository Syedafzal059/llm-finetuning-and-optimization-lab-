# Global defaults — overridden by projects/{name}/config.yaml

base_model: TinyLlama/TinyLlama-1.1B-Chat-v1.0

model:
  device: cpu
  max_new_tokens: 100

inference:
  temperature: 0.7
  top_p: 0.9

training:
  mode: lora
  epochs: 1
  batch_size: 2
  learning_rate: 2.0e-4
  max_length: 256
  logging_steps: 1
  save_steps: 10
  lora:
    rank: 8
    alpha: 16
    target_modules:
      - q_proj
      - v_proj
    dropout: 0.05
  qlora:
    bits: 4
    double_quant: true
    quant_type: nf4

data:
  val_split: 0.1

serving:
  host: 0.0.0.0
  port: 8000
  max_tokens: 256
  temperature: 0.7
  top_p: 0.9
  rate_limit: 10
  timeout: 60
  timeout_seconds: 60
  monthly_limit: 10000
  token_limit: 1000000
  max_model_len: 4096
  gpu_memory_utilization: 0.85
  max_lora_rank: 64
  quantization_enabled: true
  quantization: bitsandbytes
  dtype: auto
  trust_remote_code: false

redis:
  host: localhost
  port: 6379
  db: 0

alerts:
  email: support@example.com
  token_warning_pct: 80
  monthly_warning_pct: 80

validation:
  max_prompt_tokens: 2048

auth:
  api_keys_env_var: SERVING_API_KEYS
