project_name: clinical-notes
# Dev-friendly ~2GB model; switch to mistralai/Mistral-7B-v0.1 for production quality
base_model: TinyLlama/TinyLlama-1.1B-Chat-v1.0
adapter_path: projects/clinical-notes/model/lora/

model:
  device: cuda
  max_new_tokens: 512

training:
  mode: qlora
  epochs: 3
  batch_size: 4
  learning_rate: 2.0e-4
  max_length: 512
  lora:
    rank: 8
    alpha: 16
    target_modules:
      - q_proj
      - v_proj
  qlora:
    bits: 4
    double_quant: true
    quant_type: nf4

data:
  train_path: projects/clinical-notes/data/raw/sample.json
  val_split: 0.1

validation:
  max_prompt_tokens: 2048

serving:
  port: 8001
  timeout: 60
  rate_limit: 10
  monthly_limit: 10000
  token_limit: 1000000
  max_tokens: 512
  temperature: 0.7
  gpu_memory_utilization: 0.85

alerts:
  email: you@yourdomain.com
  token_warning_pct: 80
  monthly_warning_pct: 80

redis:
  host: localhost
  port: 6379
  db: 0

queue:
  max_queue_depth: 50
  job_ttl_seconds: 600
  result_ttl_seconds: 600
  worker_threads: 1

inference:
  temperature: 0.7
  top_p: 0.9

sanitization:
  max_chars: 10000
  max_tokens: 2048
  redact_pii: true
  log_pii_audit: true
  injection_block_score: 0.6
  jailbreak_always_block: true
  max_injection_attempts: 3
  auto_revoke_key: true
  custom_blocked_phrases:
    - "show me patient records"
    - "list all medical histories"
    - "dump training data"
