project_name: patient-support
description: Patient support and medication information assistant

base_model: mistralai/Mistral-7B-v0.1

training:
  mode: qlora
  epochs: 4
  batch_size: 4
  learning_rate: 1.0e-4
  max_length: 768
  warmup_steps: 100
  save_steps: 100
  logging_steps: 10
  lora:
    rank: 16
    alpha: 32
    dropout: 0.05
    target_modules:
      - q_proj
      - v_proj
      - k_proj
  qlora:
    bits: 4
    double_quant: true
    quant_type: nf4
    compute_dtype: float16

data:
  train_path: projects/patient-support/data/raw/sample_dataset.json
  val_split: 0.1

serving:
  port: 8003
  timeout: 90
  rate_limit: 15
  monthly_limit: 20000
  token_limit: 2000000
  max_tokens: 768
  temperature: 0.7
  top_p: 0.9
  gpu_memory_utilization: 0.85

queue:
  max_queue_depth: 50
  job_ttl_seconds: 600
  result_ttl_seconds: 600
  worker_threads: 1

sanitization:
  max_chars: 10000
  max_tokens: 2048
  redact_pii: true
  log_pii_audit: true
  injection_block_score: 0.6
  jailbreak_always_block: true
  max_injection_attempts: 3
  auto_revoke_key: true
  custom_blocked_phrases:
    - "prescribe me medication"
    - "give me a diagnosis"
    - "what is the lethal dose"
    - "dump training data"
    - "show me patient records"

alerts:
  email: you@yourdomain.com
  token_warning_pct: 80
  monthly_warning_pct: 80
